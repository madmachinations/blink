[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-live-cli"
version = "0.1.0"
description = "Standalone Blink live-view and USB recording client, with a Home Assistant integration"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.12,<4"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "build>=1", "imageio-ffmpeg>=0.6"]
ha-test = [
    "homeassistant==2026.10.0",
    "pytest-homeassistant-custom-component==0.13.371",
    "ha-ffmpeg==3.2.2",
    "av==19.0.0",
    "PyTurboJPEG==1.8.3",
    "HAP-python==5.0.0",
    "homekit-audio-proxy==1.2.1",
    "PyQRCode==1.2.1",
    "base36==0.1.1",
]

[project.scripts]
blink-live = "blink_live_client.cli:main"

[tool.setuptools]
packages = ["blink_live_client"]
package-dir = {blink_live_client = "custom_components/blink_live/blink_live_client"}
include-package-data = true

[tool.setuptools.package-data]
blink_live_client = ["*.pem", "py.typed", "NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["homebridge-blink-cameras-new-api-main"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

